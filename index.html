<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>选择活动时间</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            padding: 20px; 
            text-align: center;
        }
        h2 { margin-top: 10px; color: var(--tg-theme-text-color, #222222); }
        h3 { color: var(--tg-theme-hint-color, #777777); margin-bottom: 25px; font-weight: normal; font-size: 14px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: var(--tg-theme-text-color, #222222); }
        input, select {
            width: 100%; padding: 12px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #222222);
        }
        button {
            margin-top: 30px; width: 100%; padding: 15px;
            background-color: var(--tg-theme-button-color, #248bcf);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>📅 配置活动时间轴</h2>
    <h3>Vercel 独立托管 100% 稳定版</h3>
    
    <div class="form-group">
        <label>🛫 开始日期与时间：</label>
        <input type="datetime-local" id="startTime" required>
    </div>
    
    <div class="form-group" style="margin-top: 20px;">
        <label>⏱️ 活动持续时长：</label>
        <select id="duration">
            <option value="1">1 小时</option>
            <option value="2" selected>2 小时</option>
            <option value="3">3 小时</option>
            <option value="4">4 小时</option>
            <option value="6">6 小时</option>
            <option value="12">12 小时</option>
            <option value="24">24 一整天</option>
        </select>
    </div>

    <button id="submitBtn">⏰ 确认时间并返回</button>

    <script>
        // 初始化 Telegram WebApp 视窗控制
        const tg = window.Telegram.WebApp;
        tg.ready(); 
        tg.expand(); // 让网页在 Telegram 底部拉满全屏展示

        // 自动计算并填入当前本地时间作为默认值
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('startTime').value = now.toISOString().slice(0, 16);

        // 点击确认按钮后的核心数据传输逻辑
        document.getElementById('submitBtn').addEventListener('click', function() {
            const startVal = document.getElementById('startTime').value;
            const durationHours = parseInt(document.getElementById('duration').value);
            
            if(!startVal) {
                alert("请选择合法的开始时间！");
                return;
            }

            // 前端计算出活动结束时间
            const startDt = new Date(startVal);
            const endDt = new Date(startDt.getTime() + durationHours * 60 * 60 * 1000);

            // 标准化时间格式，输出数据库最喜欢的 "YYYY-MM-DD HH:MM" 格式字符串
            const formatTime = (dt) => {
                const pad = (num) => String(num).padStart(2, '0');
                return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
            };

            const resultData = {
                start_time: formatTime(startDt),
                end_time: formatTime(endDt)
            };

            // 🌟 核心跨端传输：利用 tg.sendData 将选好的 JSON 字符串直接拍回给机器人后台状态机
            tg.sendData(JSON.stringify(resultData));
            tg.close(); // 数据发完后网页视窗自动平滑关闭
        });
    </script>
</body>
</html>
