<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>发起社区活动</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #1f2937;
            --card-bg: rgba(255, 255, 255, 0.9);
            --hint-color: #6b7280;
            --btn-color: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --btn-text: #ffffff;
            --input-border: #e5e7eb;
            --input-bg: #ffffff;
            --focus-shadow: rgba(59, 130, 246, 0.15);
            --danger-color: #ef4444;
        }

        /* 完美融合 Telegram 原生主题色彩变量 */
        body.tg {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #1f2937);
            --card-bg: var(--tg-theme-secondary-bg-color, rgba(255, 255, 255, 0.9));
            --hint-color: var(--tg-theme-hint-color, #6b7280);
            --btn-color: var(--tg-theme-button-color, linear-gradient(135deg, #248bcf, #1c74ad));
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --input-border: rgba(128, 128, 128, 0.2);
            --input-bg: var(--tg-theme-bg-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px 16px 24px 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 440px; margin: 0 auto; flex: 1; }
        .header-panel { text-align: center; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; }
        .subtitle { color: var(--hint-color); font-size: 13px; margin: 0; }

        /* 毛玻璃高级卡片 */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        /* ─── ⚖️ 弹性盒横向对齐排版 ─── */
        .form-group {
            margin-bottom: 18px;
            position: relative;
            display: flex;          /* 🚀 全面开启弹性盒模型 */
            align-items: center;    /* 标签与输入框上下垂直居中 */
            justify-content: space-between; /* 左右拉满两端对齐 */
            gap: 12px;              /* 黄金间距 */
        }

        /* 统一管理文字标签宽度 */
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 0;       /* 消除下边距，防止上下错位 */
            width: 32%;             /* 🚀 左侧文字标签分得 32% 的宽度占比 */
            flex-shrink: 0;         /* 强制死锁，防止标签文本被右侧挤压换行 */
            text-align: left;
        }

        /* 统一控制右侧所有输入控件的固定宽度占比 */
        .form-group input, 
        .form-group .select-wrapper, 
        .form-group .stepper {
            width: 68%;             /* 🚀 右侧控件分得 68% 的宽度占比 */
            box-sizing: border-box;
        }

        /* 输入控件基础样式重构 */
        input, textarea, select {
            padding: 12px 14px; box-sizing: border-box;
            border: 1px solid var(--input-border); border-radius: 10px; font-size: 15px;
            font-weight: 500; background-color: var(--input-bg); color: var(--text-color);
            outline: none; transition: all 0.2s ease; -webkit-appearance: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #3b82f6; box-shadow: 0 0 0 4px var(--focus-shadow);
        }

        /* 下拉选择器外部容器 */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: "▼"; font-size: 11px; position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%); color: var(--hint-color); pointer-events: none; opacity: 0.6;
        }

        /* 动态字数统计小标签 */
        .counter-tag {
            position: absolute; right: 4px; top: -16px; font-size: 11px; color: var(--hint-color); font-weight: 500;
        }
        .counter-tag.danger { color: var(--danger-color); font-weight: bold; }

        /* 高级数字步进器 UI */
        .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 10px; padding: 3px; }
        .stepper-btn { width: 36px; height: 36px; background: rgba(128, 128, 128, 0.08); border: none; border-radius: 8px; font-size: 18px; font-weight: bold; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
        .stepper-btn:active { background: rgba(128, 128, 128, 0.15); transform: scale(0.95); }
        .stepper-value { font-size: 14px; font-weight: 700; color: var(--text-color); text-align: center; flex: 1; }

        /* ─── 🚨 核心优化：针对 textarea 详情介绍的例外机制 ─── */
        /* 详情介绍字数多，横向挤在一起太丑，强制恢复为高级上下堆叠形态 */
        .card .form-group.textarea-group {
            display: block;         /* 解除 flex，回归普通的块级上下堆叠 */
            margin-top: 24px;       /* 增加一点顶部间距，显得错落有致 */
        }
        .card .form-group.textarea-group label {
            width: 100%;            /* 标签文字重新拉满全屏 */
            margin-bottom: 8px;     /* 留出舒适的下边距 */
            display: block;
        }
        .card .form-group.textarea-group textarea {
            width: 100%;            /* 文本域输入框 100% 优雅拉满卡片内壁 */
            height: 90px; resize: none; font-family: inherit; display: block;
        }

        /* 底部固定动作区域 */
        .action-area { width: 100%; max-width: 440px; margin: 0 auto; }
        button.submit-btn {
            width: 100%; padding: 15px; background: var(--btn-color); color: var(--btn-text);
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); transition: all 0.2s;
        }
        button.submit-btn:active { transform: scale(0.98); opacity: 0.95; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-panel">
            <h2>📝 完善活动信息</h2>
            <p class="subtitle">请一气呵成填写下方核心表单</p>
        </div>
        
        <div class="card">
            <div class="form-group">
                <label>📌 活动主题</label>
                <span class="counter-tag" id="titleCount">0/30</span>
                <input type="text" id="title" placeholder="起个响亮的名字..." maxlength="30" required>
            </div>

            <div class="form-group">
                <label>🛫 开始时间</label>
                <input type="datetime-local" id="startTime" required>
            </div>

            <div class="form-group">
                <label>⏱️ 预计时长</label>
                <div class="select-wrapper">
                    <select id="duration">
                        <option value="1">1 小时 (快闪聚会)</option>
                        <option value="2" selected>2 小时 (标准活动)</option>
                        <option value="3">3 小时 (深度畅聊)</option>
                        <option value="4">4 小时 (狂欢派对)</option>
                        <option value="6">6 小时 (半天协同)</option>
                        <option value="12">12 小时 (昼夜狂欢)</option>
                        <option value="24">24 一整天 (周末度假)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>👥 人数限制</label>
                <div class="stepper">
                    <button type="button" class="stepper-btn" id="minusBtn">−</button>
                    <div class="stepper-value" id="stepperValue">👥 不限人数 (0)</div>
                    <button type="button" class="stepper-btn" id="plusBtn">+</button>
                </div>
            </div>

            <div class="form-group textarea-group">
                <label>💬 活动要求与详情介绍</label>
                <span class="counter-tag" id="infoCount">0/200</span>
                <textarea id="info" placeholder="请简要介绍聚会内容、费用AA情况等要求（200字以内）..." maxlength="200" required></textarea>
            </div>
        </div>
    </div>

    <div class="action-area">
        <button class="submit-btn" id="submitBtn">⏰ 锁定信息并下一步</button>
    </div>

    <script>
        // 应用 Telegram 暗黑/明亮自适应主题类
        if (window.Telegram && window.Telegram.WebApp) { document.body.classList.add('tg'); }
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // 智能时间戳初始化
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('startTime').value = now.toISOString().slice(0, 16);

        // 步进器核心防呆状态机
        let slotsCount = 0;
        const stepperVal = document.getElementById('stepperValue');
        
        document.getElementById('minusBtn').addEventListener('click', () => {
            if (slotsCount > 0) {
                slotsCount = slotsCount === 5 ? 0 : slotsCount - 1; // 降到5人后再减，直接变不限
                updateStepper();
            }
        });
        document.getElementById('plusBtn').addEventListener('click', () => {
            if (slotsCount < 99) {
                slotsCount = slotsCount === 0 ? 5 : slotsCount + 1; // 从不限往上加，直接起步5人
                updateStepper();
            }
        });
        function updateStepper() {
            stepperVal.innerText = slotsCount === 0 ? "👥 不限人数 (0)" : `👥 限制 ${slotsCount} 人`;
        }

        // 动态字数同步监听
        const titleInput = document.getElementById('title');
        const titleCount = document.getElementById('titleCount');
        titleInput.addEventListener('input', () => {
            titleCount.innerText = `${titleInput.value.length}/30`;
        });

        const infoInput = document.getElementById('info');
        const infoCount = document.getElementById('infoCount');
        infoInput.addEventListener('input', () => {
            const len = infoInput.value.length;
            infoCount.innerText = `${len}/200`;
            if (len >= 190) { infoCount.classList.add('danger'); } 
            else { infoCount.classList.remove('danger'); }
        });

        // 终极打包防御检查与数据跨端回传
        document.getElementById('submitBtn').addEventListener('click', function() {
            const title = titleInput.value.trim();
            const info = infoInput.value.trim();
            const startVal = document.getElementById('startTime').value;
            const durationHours = parseInt(document.getElementById('duration').value);
            
            // 拦截空数据
            if(!title || !info || !startVal) {
                showWarning("请完整填写活动主题和详情介绍！");
                return;
            }
            // 绝对死锁字数，防止溢出
            if(title.length > 30 || info.length > 200) {
                showWarning("内容超出字数限制，请精简后提交！");
                return;
            }

            const startDt = new Date(startVal);
            const endDt = new Date(startDt.getTime() + durationHours * 60 * 60 * 1000);
            const formatTime = (dt) => {
                const pad = (num) => String(num).padStart(2, '0');
                return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
            };

            // 高度压缩的 JSON 骨架，彻底解决10KB死锁
            const resultData = {
                title: title,
                info: info,
                slots: slotsCount,
                start_time: formatTime(startDt),
                end_time: formatTime(endDt)
            };

            // 触发高级手机原生触感震动反馈
            if (tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); }
            tg.sendData(JSON.stringify(resultData));
            tg.close();
        });

        function showWarning(msg) {
            if(tg.showPopup) { tg.showPopup({title: "检查提示", message: msg, buttons: [{type: "ok"}]}); } 
            else { alert(msg); }
        }
    </script>
</body>
</html>
